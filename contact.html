<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - The Rustic Fork</title>
</head>
<body>
  <h1>Contact The Rustic Fork</h1>
  <p>We would love to hear from you. Please fill out the form below to make a reservation or ask a question.</p>
  
  <form action="#" method="get">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>
    
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>
    
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="4" required></textarea><br><br>
    
    <input type="submit" value="Send Message">
  </form>
  
  <br>
  <p><a href="index.html">Back to Menu</a></p>
</body>
</html>
